name: roa-jewelry

# Dokploy sets COMPOSE_PROJECT_NAME per app (e.g. jewelty-roa-udrjcv), which overrides
# this `name:` field. Network and volumes use fixed external names so redeploys reuse
# the same resources regardless of project slug.
#
# Traefik -> proxy (dokploy-network) -> roa-jewelry-backend:3000 (roa-internal only).
# Never proxy to generic "app" on dokploy-network — that resolves to AGMERZ.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - roa-internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roa_jewelry
    volumes:
      - roa_jewelry_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roa_jewelry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://roa-jewerly.com}
        AUTH_SECRET: ${AUTH_SECRET:-build-time-placeholder-minimum-32-characters-long}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      roa-internal:
        aliases:
          - roa-jewelry-backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').createConnection({ port: 3000, host: '127.0.0.1' }).on('connect', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/roa_jewelry?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://roa-jewerly.com}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-32-chars-min}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      MEDIA_UPLOAD_DIR: ${MEDIA_UPLOAD_DIR:-./public/uploads}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
    volumes:
      - roa_jewelry_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - roa-internal
      - dokploy-network
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.roa-jewelry-roa-web.rule=Host(`roa-jewerly.com`) || Host(`www.roa-jewerly.com`)
      - traefik.http.routers.roa-jewelry-roa-web.entrypoints=web
      - traefik.http.routers.roa-jewelry-roa-web.middlewares=redirect-to-https@file
      - traefik.http.routers.roa-jewelry-roa-web.service=roa-jewelry-roa-web
      - traefik.http.routers.roa-jewelry-roa-web.priority=1000
      - traefik.http.services.roa-jewelry-roa-web.loadbalancer.server.port=80
      - traefik.http.routers.roa-jewelry-roa-websecure.rule=Host(`roa-jewerly.com`) || Host(`www.roa-jewerly.com`)
      - traefik.http.routers.roa-jewelry-roa-websecure.entrypoints=websecure
      - traefik.http.routers.roa-jewelry-roa-websecure.tls=true
      - traefik.http.routers.roa-jewelry-roa-websecure.tls.certResolver=letsencrypt
      - traefik.http.routers.roa-jewelry-roa-websecure.service=roa-jewelry-roa-websecure
      - traefik.http.routers.roa-jewelry-roa-websecure.priority=1000
      - traefik.http.services.roa-jewelry-roa-websecure.loadbalancer.server.port=80
    depends_on:
      app:
        condition: service_healthy

networks:
  roa-internal:
    name: roa-jewelry-internal
    external: true
  dokploy-network:
    external: true

volumes:
  roa_jewelry_postgres_data:
    name: roa_jewelry_postgres_data
    external: true
  roa_jewelry_uploads:
    name: roa_jewelry_uploads
    external: true
