name: roa-jewelry

# Dokploy sets COMPOSE_PROJECT_NAME per app (e.g. jewelty-roa-udrjcv), which overrides
# this `name:` field. Network and volumes use fixed external names so redeploys reuse
# the same resources regardless of project slug.
#
# Production routing:
#   Internet -> Traefik (dokploy-network) -> roa-app:3000 -> roa-postgres:5432
#
# First deploy on a fresh host:
#   docker network create roa-jewelry-internal
#   docker network create dokploy-network   # usually already exists on Dokploy VPS
#   docker volume create roa_jewelry_postgres_data
#   docker volume create roa_jewelry_uploads
#
# Local dev uses docker-compose.local.yml (ports 5432/3000, non-external networks).
services:
  roa-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - roa-internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roa_jewelry
    volumes:
      - roa_jewelry_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roa_jewelry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  roa-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://roa-jewerly.com}
        AUTH_SECRET: ${AUTH_SECRET:-build-time-placeholder-minimum-32-characters-long}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - roa-internal
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').createConnection({ port: 3000, host: '127.0.0.1' }).on('connect', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@roa-postgres:5432/roa_jewelry?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://roa-jewerly.com}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-32-chars-min}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      MEDIA_UPLOAD_DIR: ${MEDIA_UPLOAD_DIR:-./public/uploads}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
    volumes:
      - roa_jewelry_uploads:/app/public/uploads
    depends_on:
      roa-postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.roa-jewelry-web.rule=Host(`roa-jewerly.com`) || Host(`www.roa-jewerly.com`)
      - traefik.http.routers.roa-jewelry-web.entrypoints=web
      - traefik.http.routers.roa-jewelry-web.middlewares=redirect-to-https@file
      - traefik.http.routers.roa-jewelry-web.service=roa-jewelry-web
      - traefik.http.routers.roa-jewelry-web.priority=1000
      - traefik.http.services.roa-jewelry-web.loadbalancer.server.port=3000
      - traefik.http.routers.roa-jewelry-websecure.rule=Host(`roa-jewerly.com`) || Host(`www.roa-jewerly.com`)
      - traefik.http.routers.roa-jewelry-websecure.entrypoints=websecure
      - traefik.http.routers.roa-jewelry-websecure.tls=true
      - traefik.http.routers.roa-jewelry-websecure.tls.certResolver=letsencrypt
      - traefik.http.routers.roa-jewelry-websecure.service=roa-jewelry-websecure
      - traefik.http.routers.roa-jewelry-websecure.priority=1000
      - traefik.http.services.roa-jewelry-websecure.loadbalancer.server.port=3000

networks:
  roa-internal:
    name: roa-jewelry-internal
    external: true
  dokploy-network:
    external: true

volumes:
  roa_jewelry_postgres_data:
    name: roa_jewelry_postgres_data
    external: true
  roa_jewelry_uploads:
    name: roa_jewelry_uploads
    external: true
